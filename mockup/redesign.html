<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeBox — макет новой компоновки</title>
<style>
:root {
  --bg: #0b0b0e; --panel: #111115; --panel2: #18181d; --hover: #1e1e25; --line: #24242c; --line2: #363640;
  --text: #ececf1; --dim: #a3a3ae; --dim2: #6c6c78; --accent: #6366f1; --accent2: #a5b4fc;
  --soft: rgba(99,102,241,.16); --danger: #f87171; --amber: #fbbf24;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #3a3a44 transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, 'Segoe UI', Roboto, sans-serif; overflow: hidden; color-scheme: dark; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.bar, .top { min-width: 0; overflow: hidden; }

/* верхняя строка */
.top { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 600; font-size: 14px; white-space: nowrap; }
.brand small { color: var(--dim2); font-weight: 400; margin-left: 6px; }
.omni { position: relative; flex: 1; max-width: 620px; margin: 0 auto; }
.omni svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim2); }
.omni input { width: 100%; height: 34px; padding: 0 44px 0 34px; background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; outline: none; }
.omni input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.omni input::placeholder { color: var(--dim2); }
.omni kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 11px system-ui; color: var(--dim2); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel2); white-space: nowrap; }
.btn:hover { border-color: var(--dim2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #7376f5; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; color: var(--dim); }
.ib:hover { background: var(--hover); color: var(--text); }
.ib.on { background: var(--soft); color: var(--accent2); }

.body { display: flex; min-height: 0; position: relative; }

/* панели «Папки» и «Теги» */
.dock { display: flex; flex: none; min-height: 0; background: var(--panel); position: relative; }
.dock[hidden] { display: none; }
.dock.left { border-right: 1px solid var(--line); }
.dock.right { border-left: 1px solid var(--line); }
.dock.stack { flex-direction: column; width: var(--dw); }
.dock.cols { flex-direction: row; }
.panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.dock.stack .panel { flex: 1 1 0; }
.dock.stack.split .panel:first-child { flex: 0 0 calc(var(--split) * 100%); }
.dock.stack .panel.collapsed { flex: none; }
.dock.stack .panel + .panel, .dock.stack .hsplit + .panel { border-top: 1px solid var(--line); }
.dock.cols .panel { width: var(--pw); flex: none; }
.dock.cols .panel + .panel { border-left: 1px solid var(--line); }
.phead { display: flex; align-items: center; gap: 4px; height: 36px; flex: none; padding: 0 6px 0 10px; color: var(--dim2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; cursor: grab; user-select: none; }
.phead .t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
.phead .t .badge { text-transform: none; letter-spacing: 0; }
.phead .grip { opacity: 0; color: var(--dim2); }
.phead:hover .grip { opacity: .8; }
.phead:hover { color: var(--dim); }
.ib.sm { width: 24px; height: 24px; border-radius: 6px; }
.panel.collapsed .phead { border-bottom: 0; }
.panel .tsearch { padding: 0 10px 8px; }
.panel.lifted { opacity: .45; }
.hsplit { flex: none; height: 7px; margin: -3px 0 -4px; position: relative; z-index: 3; cursor: row-resize; }
.vsplit { position: absolute; top: 0; bottom: 0; width: 7px; z-index: 3; cursor: col-resize; }
.vsplit.r { right: -4px; } .vsplit.l { left: -4px; }
.hsplit::after, .vsplit::after { content: ''; position: absolute; background: var(--accent); opacity: 0; transition: opacity .12s; }
.hsplit::after { left: 0; right: 0; top: 2px; height: 3px; }
.vsplit::after { top: 0; bottom: 0; left: 2px; width: 3px; }
.hsplit:hover::after, .vsplit:hover::after, .hsplit.on::after, .vsplit.on::after { opacity: .8; }
body.resizing, body.pdrag { user-select: none; }
body.resizing * , body.pdrag * { cursor: inherit !important; }
body.pdrag { cursor: grabbing; }
#ghost { position: fixed; z-index: 90; pointer-events: none; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: #26262e; border: 1px solid var(--accent); box-shadow: 0 8px 24px #000a; font-size: 12px; }
#ghost[hidden], #dropPv[hidden], .edgezone[hidden] { display: none; }
#dropPv { position: fixed; z-index: 85; pointer-events: none; background: rgba(99,102,241,.22); border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; color: #fff; font-weight: 600; transition: all .08s; }
.edgezone { position: fixed; z-index: 80; pointer-events: none; border: 1px dashed #4b4d8f; background: rgba(99,102,241,.05); border-radius: 8px; }
.sidescroll { flex: 1; overflow-y: auto; padding: 0 6px 10px; min-height: 0; }
.sidefoot { border-top: 1px solid var(--line); padding: 6px; display: flex; align-items: center; gap: 4px; }
.node, .trow, .chead, .foot { display: flex; align-items: center; gap: 7px; width: 100%; height: 28px; padding: 0 8px; border-radius: 7px; text-align: left; color: var(--dim); }
.node:hover, .trow:hover, .chead:hover, .foot:hover { background: var(--hover); color: var(--text); }
.node.on { background: var(--soft); color: var(--text); }
.node .chev, .chead .chev { color: var(--dim2); transition: transform .12s; }
.chev.open { transform: rotate(90deg); }
.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cnt { color: var(--dim2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.tsearch { display: flex; gap: 6px; padding: 0 4px 8px; }
.tsearch input { flex: 1; min-width: 0; height: 28px; padding: 0 9px; background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; outline: none; }
.tsearch input:focus { border-color: var(--accent); }
.tsearch button { height: 28px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 7px; color: var(--dim); font-size: 12px; white-space: nowrap; }
.tsearch button:hover { color: var(--text); border-color: var(--dim2); }
.chead { margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim2); height: 26px; }
.chead .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.trow { padding-left: 12px; }
.trow .tick { width: 15px; height: 15px; border-radius: 4px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: transparent; }
.trow.on { color: var(--text); }
.trow.on .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
.trow .more { display: none; width: 20px; height: 20px; border-radius: 5px; align-items: center; justify-content: center; color: var(--dim2); }
.trow:hover .more { display: flex; }
.trow:hover .cnt { display: none; }
.trow .more:hover { background: var(--line2); color: var(--text); }
.morerow { height: 24px; padding: 0 8px 0 34px; color: var(--dim2); font-size: 12px; border-radius: 7px; width: 100%; text-align: left; }
.morerow:hover { color: var(--accent2); }
.empty { color: var(--dim2); padding: 10px 12px; }

/* центр */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; }
.crumbs button { padding: 3px 6px; border-radius: 6px; color: var(--dim); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs button.cur { color: var(--text); font-weight: 600; font-size: 14px; }
.crumbs .sep { color: var(--dim2); }
.crumbs .total { color: var(--dim2); margin-left: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; height: 30px; }
.seg button { padding: 0 10px; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.on { background: var(--soft); color: var(--accent2); }
.bar select { height: 30px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 0 6px; }
.selinfo { font-weight: 600; margin-right: 4px; white-space: nowrap; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; color: var(--dim); white-space: nowrap; }
.tb:hover { background: var(--hover); color: var(--text); }
.tb.danger:hover { color: var(--danger); }

.frow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); background: #0f0f18; }
.frow[hidden] { display: none; }
.frow .lbl { color: var(--dim2); }
.fgrp { display: inline-flex; align-items: center; gap: 4px; padding: 2px 3px 2px 9px; border: 1px solid #3b3d7a; background: var(--soft); border-radius: 8px; }
.fgrp .gl { color: var(--accent2); font-size: 12px; margin-right: 2px; }
.fgrp i { font-style: normal; color: var(--dim2); font-size: 12px; }
.ft { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 5px 0 8px; border-radius: 6px; background: #2b2d63; color: #fff; }
.ft:hover { background: #3a3d85; }
.ft svg { opacity: .6; }
.joiner { color: var(--dim2); font-size: 12px; }
.ghost { height: 26px; padding: 0 9px; border-radius: 7px; border: 1px dashed var(--line2); color: var(--dim); display: inline-flex; align-items: center; gap: 5px; }
.ghost:hover { color: var(--text); border-color: var(--dim2); }
.frow .sp { flex: 1; }
.frow .seg { height: 26px; }
.link { color: var(--dim); padding: 3px 6px; border-radius: 6px; }
.link:hover { color: var(--text); background: var(--hover); }

.gridwrap { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 168px), 1fr)); user-select: none; }
.card { position: relative; border-radius: 11px; padding: 6px 6px 8px; border: 1px solid transparent; cursor: default; }
.card:hover { background: var(--panel2); }
.card.sel { background: var(--soft); border-color: var(--accent); }
.thumb { position: relative; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.thumb .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.thumb .paper { position: absolute; inset: 10% 22% 0; background: #e9e6dd; border-radius: 4px 4px 0 0; padding: 12% 10% 0; display: flex; flex-direction: column; gap: 7%; }
.thumb .paper b { display: block; height: 5%; min-height: 3px; background: #b9b5a8; border-radius: 2px; }
.thumb .paper b:first-child { width: 60%; background: #6f6c63; }
.thumb .play { position: relative; width: 34px; height: 34px; border-radius: 50%; background: #000a; display: flex; align-items: center; justify-content: center; color: #fff; }
.thumb .dur { position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px; background: #000b; font-size: 11px; }
.thumb .dom { position: absolute; left: 8px; right: 8px; bottom: 7px; font-size: 11px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.card .cb { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; border-radius: 6px; border: 1px solid #d4d4d8; background: #0009; color: transparent; display: flex; align-items: center; justify-content: center; opacity: 0; z-index: 1; }
.card:hover .cb, .card.sel .cb, .anysel .cb { opacity: 1; }
.card.sel .cb { background: var(--accent); border-color: var(--accent); color: #fff; }
.card .title { margin: 7px 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cap { margin: 1px 4px 0; color: var(--dim2); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ctags { margin: 5px 4px 0; display: flex; gap: 4px; height: 18px; overflow: hidden; }
.mini { padding: 0 6px; height: 18px; line-height: 17px; border-radius: 5px; border: 1px solid var(--line2); color: var(--dim); font-size: 11px; white-space: nowrap; }
.blank { padding: 70px 20px; text-align: center; color: var(--dim2); }
.blank b { display: block; color: var(--dim); font-size: 15px; font-weight: 500; margin-bottom: 4px; }

/* правая панель */
.insp { width: 320px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.insp[hidden] { display: none; }
.insp .pv { aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; flex: none; }
.insp .pv .thumb { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.insp .stack { position: relative; height: 150px; flex: none; }
.insp .stack .thumb { position: absolute; width: 58%; left: 21%; top: 12px; box-shadow: 0 6px 20px #000a; border: 1px solid #0006; }
.insp h2 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.insp .sub { color: var(--dim2); margin-top: 2px; }
.acts { display: flex; gap: 4px; margin: -4px -4px; }
.acts .tb { flex: 1; justify-content: center; padding: 0 6px; border: 1px solid var(--line); }
.sec h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--dim2); display: flex; align-items: center; gap: 6px; }
.trows { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: start; margin-bottom: 10px; }
.trows .cl { color: var(--dim2); font-size: 12px; line-height: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 7px; background: #26262e; border: 1px solid var(--line2); max-width: 100%; }
.chip:hover { border-color: var(--accent); background: #2c2c38; }
.chip.inh { background: transparent; border-style: dashed; color: var(--dim); }
.chip.part { background: transparent; border-style: dotted; color: var(--dim); }
.chip small { color: var(--dim2); font-size: 11px; }
.chip svg { color: var(--dim2); }
.addtag { position: relative; }
.addtag svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--dim2); }
.addtag input, .insp textarea { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; outline: none; }
.addtag input { height: 32px; padding: 0 10px 0 30px; }
.addtag input:focus, .insp textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.insp textarea { padding: 8px 10px; min-height: 64px; resize: vertical; display: block; }
.hint { color: var(--dim2); font-size: 11.5px; margin-top: 6px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 0; font-size: 12px; }
dt { color: var(--dim2); } dd { margin: 0; color: var(--dim); overflow-wrap: anywhere; }

.status { display: flex; gap: 14px; padding: 5px 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--dim2); font-size: 12px; }
.status .sp { flex: 1; }

/* поповер, тост, просмотр, пояснения */
#pop { position: fixed; z-index: 50; background: #1b1b22; border: 1px solid var(--line2); border-radius: 10px; padding: 5px; box-shadow: 0 12px 34px #000b; max-height: 360px; overflow-y: auto; min-width: 200px; }
#pop[hidden] { display: none; }
#pop .ph { padding: 6px 9px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim2); }
#pop .pi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 4px 9px; border-radius: 7px; text-align: left; }
#pop .pi:hover, #pop .pi.act { background: var(--soft); }
#pop .pi.danger { color: var(--danger); }
#pop .pi .c { color: var(--dim2); }
#pop .pi .r { margin-left: auto; color: var(--dim2); font-size: 11.5px; padding-left: 14px; }
#pop .pi .d { display: block; color: var(--dim2); font-size: 11.5px; }
#pop .pnote { padding: 6px 9px; color: var(--dim2); font-size: 12px; max-width: 250px; }
#pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
#toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 70; background: #26262e; border: 1px solid var(--line2); border-radius: 9px; padding: 8px 14px; box-shadow: 0 8px 24px #000a; }
#toast[hidden] { display: none; }
#viewer { position: fixed; inset: 0; z-index: 40; background: #050507f2; display: flex; }
#viewer[hidden] { display: none; }
.vmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vtop { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.vtop .nm { font-size: 14px; }
.vstage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 14px 20px; }
.vstage .thumb { height: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; flex: 0 1 auto; min-width: 0; }
.vnav { width: 40px; height: 64px; border-radius: 10px; color: var(--dim); display: flex; align-items: center; justify-content: center; flex: none; }
.vnav:hover { background: var(--hover); color: #fff; }
#fab { position: fixed; right: 16px; bottom: 38px; z-index: 30; height: 34px; padding: 0 14px; border-radius: 17px; background: #2a2208; border: 1px solid #7c5e10; color: var(--amber); font-weight: 600; box-shadow: 0 6px 20px #0009; }
#notes { position: fixed; right: 16px; bottom: 80px; z-index: 30; width: 370px; max-width: calc(100vw - 32px); max-height: calc(100vh - 150px); overflow-y: auto; background: #1b1a14; border: 1px solid #7c5e10; border-radius: 12px; padding: 12px; box-shadow: 0 14px 40px #000c; }
#notes[hidden] { display: none; }
#notes h4 { margin: 0 0 8px; color: var(--amber); font-size: 13px; }
#notes .n { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: default; }
#notes .n:hover { background: #2a2718; }
#notes .n b { width: 20px; height: 20px; border-radius: 50%; background: var(--amber); color: #1b1a14; font-size: 11px; display: flex; align-items: center; justify-content: center; }
#notes .n span { color: #e7e2cf; } #notes .n em { display: block; font-style: normal; color: #9c9682; font-size: 12px; margin-top: 2px; }
.hl { outline: 2px solid var(--amber) !important; outline-offset: -2px; }

@media (max-width: 1180px) {
  .insp { width: 280px; }
  .brand small { display: none; }
}
@media (max-width: 860px) {
  .insp:not(.vinsp) { position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; box-shadow: -14px 0 34px #000a; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">SafeBox<small>archive.safebox</small></div>
    <div class="omni" id="omniBox">
      <span id="omniIcon"></span>
      <input id="omni" autocomplete="off" spellcheck="false" placeholder="Поиск: имя, описание или тег…">
      <kbd>/</kbd>
    </div>
    <button class="btn primary" data-act="add-menu" id="addBtn"></button>
    <button class="ib" data-act="settings" title="Настройки" id="gearBtn"></button>
    <button class="ib" data-act="lock" title="Заблокировать сейф" id="lockBtn"></button>
  </header>
  <div class="body" id="body">
    <div class="dock left" id="dockL"></div>
    <section class="content">
      <div class="bar" id="bar"></div>
      <div class="frow" id="frow" hidden></div>
      <div class="gridwrap" id="gridWrap"><div class="grid" id="grid"></div></div>
    </section>
    <div class="dock right" id="dockR"></div>
    <aside class="insp" id="insp"></aside>
  </div>
  <footer class="status" id="status"></footer>
</div>
<div id="pop" hidden></div>
<div class="edgezone" id="ezL" hidden></div><div class="edgezone" id="ezR" hidden></div><div id="dropPv" hidden></div><div id="ghost" hidden></div>
<div id="viewer" hidden></div>
<div id="toast" hidden></div>
<div id="notes" hidden></div>
<button id="fab" data-act="notes">Что изменилось · 8</button>

<script>
/* ───── иконки ───── */
const P = {
  search: '<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',

function doAdd(tag) {
  for (const e of targets().map(get)) if (!e.direct.some((d) => d.tag === tag)) e.direct.push({ tag, inherit: e.kind === 'folder' });
  S.recent = [tag, ...S.recent.filter((t) => t !== tag)].slice(0, 4);
  const key = S.viewer ? 'v' : 'm'; closePop(); render();
  const inp = document.getElementById('addtag-' + key); if (inp) { inp.focus(); addPop(inp); }
}

/* ───── действия ───── */
const ACT = {
  // при включённом фильтре щелчок по папке не сбрасывает его, а сужает до этой папки
  nav: (d) => { S.folder = d.id || null; S.sel.clear(); if (active()) S.filter.scope = S.folder ? 'folder' : 'vault'; if (S.folder) { let p = get(S.folder).parent; while (p) { S.open.add(p); p = get(p).parent; } } render(); },
  twist: (d, el, ev) => { ev.stopPropagation(); S.open.has(d.id) ? S.open.delete(d.id) : S.open.add(d.id); render(); },
  cat: (d) => { S.catClosed.has(d.cat) ? S.catClosed.delete(d.cat) : S.catClosed.add(d.cat); render(); },
  'cat-full': (d) => { S.catFull.has(d.cat) ? S.catFull.delete(d.cat) : S.catFull.add(d.cat); render(); },
  'tag-sort': () => { S.tagSort = S.tagSort === 'count' ? 'alpha' : 'count'; render(); },
  'toggle-tag': (d) => { const i = S.filter.tags.indexOf(d.tag); i < 0 ? S.filter.tags.push(d.tag) : S.filter.tags.splice(i, 1); render(); },
  'tag-more': (d, el, ev) => { ev.stopPropagation(); const t = TAGS.get(d.tag); openPop(el, `<div class="ph">${t.catName}: ${esc(t.name)}</div>${['Переименовать', 'Слить с другим тегом…', 'Перенести в категорию…'].map((x) => `<button class="pi" data-act="mock" data-msg="${x} — на месте, без отдельного экрана">${x}</button>`).join('')}<hr><button class="pi danger" data-act="mock" data-msg="Удаление тега — с подтверждением">Удалить тег</button>`); },
  card: (d, el, ev) => {
    // двойной щелчок: плитки перерисовываются после первого, поэтому ловим его по счётчику кликов
    if (ev.detail === 2) { const e = get(d.id); if (e.kind === 'folder') return ACT.nav({ id: e.id }); const ids = visible().filter((x) => x.kind !== 'folder').map((x) => x.id); S.viewer = { ids, i: ids.indexOf(e.id) }; return render(); }
    const list = visible().map((e) => e.id);
    if (ev.shiftKey && S.anchor) { const a = list.indexOf(S.anchor), b = list.indexOf(d.id); if (!ev.ctrlKey) S.sel.clear(); for (let i = Math.min(a, b); i <= Math.max(a, b); i++) S.sel.add(list[i]); }
    else if (ev.ctrlKey || ev.metaKey) { S.sel.has(d.id) ? S.sel.delete(d.id) : S.sel.add(d.id); S.anchor = d.id; }
    else { S.sel = new Set([d.id]); S.anchor = d.id; }
    render();
  },
  check: (d, el, ev) => { ev.stopPropagation(); S.sel.has(d.id) ? S.sel.delete(d.id) : S.sel.add(d.id); S.anchor = d.id; render(); },
  'clear-sel': () => { S.sel.clear(); render(); },
  del: () => { toast(`В корзину: ${S.viewer ? 1 : S.sel.size} · Ctrl+Z — вернуть`); },
  size: (d) => { S.size = d.size; render(); },
  'card-tags': () => { S.cardTags = !S.cardTags; render(); },
  insp: () => { S.insp = !S.insp; render(); },
  scope: (d) => { if (d.scope === 'folder' && !S.folder) return toast('Сначала откройте папку в панели «Папки»'); S.filter.scope = d.scope; render(); },
  reset: () => { S.filter.tags = []; S.q = ''; render(); },
  'clear-q': () => { S.q = ''; render(); },
  'focus-omni': () => { $('#omni').focus(); },
  'mode-menu': (d, el) => openPop(el, Object.entries(MODES).map(([k, [n, hint]]) => `<button class="pi" data-act="mode" data-mode="${k}"><span style="width:14px">${S.filter.mode === k ? ic('check', 13) : ''}</span><span>${cap(n)}<span class="d">${hint}</span></span></button>`).join('')),
  mode: (d) => { S.filter.mode = d.mode; closePop(); render(); },
  'omni-tag': (d) => omniPick(S.omni.findIndex((x) => x.tag === d.tag)),
  'omni-name': () => omniPick(S.omni.length - 1),
  'add-tag': (d) => doAdd(d.tag),
  'create-tag': (d) => { const c = CATS.find((x) => x.id === d.cat), id = `${c.id}:${d.name}`; if (!TAGS.has(id)) { c.tags.push(d.name); TAGS.set(id, { id, cat: c.id, catName: c.name, name: d.name, count: 0 }); } doAdd(id); toast(`Создан тег «${d.name}» в категории «${c.name}»`); },
  chip: (d, el) => {
    const es = targets().map(get), s = tagStats(es).get(d.tag), t = TAGS.get(d.tag), total = s.direct + s.inh;
    let h = `<div class="ph">${t.catName}: ${esc(t.name)}</div><button class="pi" data-act="only-tag" data-tag="${t.id}">${ic('search', 14)}Показать все с этим тегом<span class="r">${t.count}</span></button>`;
    if (active() && !S.filter.tags.includes(t.id)) h += `<button class="pi" data-act="plus-tag" data-tag="${t.id}">${ic('plus', 14)}Добавить к текущему фильтру</button>`;
    if (total < es.length) h += `<button class="pi" data-act="add-tag" data-tag="${t.id}">${ic('check', 14)}Поставить всем выбранным (${es.length})</button>`;
    if (s.direct && es.some((e) => e.kind === 'folder')) h += `<button class="pi" data-act="inherit" data-tag="${t.id}"><span style="width:16px">${s.inheritOn ? ic('check', 14) : ''}</span>Действует на вложенное</button>`;
    if (s.inh) h += `<button class="pi" data-act="nav-src" data-id="${s.from}">${ic('folder', 14)}Перейти к папке «${esc(get(s.from).name)}»</button>`;
    h += '<hr>' + (s.direct ? `<button class="pi danger" data-act="remove-tag" data-tag="${t.id}">${ic('x', 14)}Снять тег${es.length > 1 ? ' у выбранных' : ''}</button>` : `<div class="pnote">Тег унаследован от папки — снимается у неё.</div>`);
    openPop(el, h);
  },
  'only-tag': (d) => { S.filter.tags = [d.tag]; S.q = ''; S.filter.scope = 'vault'; S.viewer = null; S.sel.clear(); closePop(); render(); },
  'plus-tag': (d) => { S.filter.tags.push(d.tag); S.viewer = null; closePop(); render(); },
  inherit: (d) => { const es = targets().map(get), on = es.some((e) => e.direct.some((x) => x.tag === d.tag && x.inherit)); for (const e of es) for (const x of e.direct) if (x.tag === d.tag && e.kind === 'folder') x.inherit = !on; closePop(); render(); },
  'remove-tag': (d) => { for (const e of targets().map(get)) e.direct = e.direct.filter((x) => x.tag !== d.tag); closePop(); render(); },
  'nav-src': (d) => { S.viewer = null; S.filter.tags = []; S.q = ''; closePop(); ACT.nav({ id: d.id }); },
  vclose: () => { S.viewer = null; render(); },
  vinsp: () => { S.vinsp = !S.vinsp; render(); },
  vstep: (d) => { const n = S.viewer.ids.length; S.viewer.i = (S.viewer.i + Number(d.d) + n) % n; closePop(); render(); },
  'add-menu': (d, el) => openPop(el, ['Файлы…', 'Папку целиком…', 'Ссылку (или просто Ctrl+V)', 'Закладки из браузера…', 'Следить за папкой на диске…', 'Новую папку'].map((x) => `<button class="pi" data-act="mock" data-msg="${x}">${x}</button>`).join('')),
  settings: (d, el) => openPop(el, ['Язык тегов: RU / EN', 'Автоблокировка', 'Сменить пароль'].map((x) => `<button class="pi" data-act="mock" data-msg="${x}">${x}</button>`).join('')),
  lock: () => toast('Сейф заблокирован бы :)'),
  collapse: (d) => { S.collapsed.has(d.panel) ? S.collapsed.delete(d.panel) : S.collapsed.add(d.panel); render(); },
  'layout-menu': (d, el) => { const cur = currentPreset(); openPop(el, '<div class="ph">Расположение панелей</div>' + Object.entries(PRESETS).map(([k, [n, hint]]) => `<button class="pi" data-act="preset" data-k="${k}"><span style="width:14px">${cur === k ? ic('check', 13) : ''}</span><span>${n}<span class="d">${hint}</span></span></button>`).join('') + '<hr><div class="pnote">Или перетащите заголовок панели на другую панель или к краю галереи. Границы панелей тянутся мышью, двойной щелчок по границе — исходный размер.</div>', 290); },
  preset: (d) => { S.layout = clone(PRESETS[d.k][2]); S.collapsed.clear(); saveLayout(); closePop(); render(); },
  mock: (d) => { closePop(); toast(d.msg); },
  notes: () => { const n = $('#notes'); n.hidden = !n.hidden; },
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (ev.target.closest('#gridWrap') && S.sel.size) { S.sel.clear(); render(); } return; }
  ACT[el.dataset.act]?.(el.dataset, el, ev);
});
document.addEventListener('mousedown', (ev) => {
  if ($('#pop').hidden) return;
  if (ev.target.closest('#pop')) { ev.preventDefault(); return; }
  if (popAnchor && (popAnchor === ev.target || popAnchor.contains(ev.target))) return;
  closePop();
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'omni') { S.omniIdx = 0; omniPop(); }
  else if (t.id === 'tagQ') { S.tagQ = t.value; render(); }
  else if (t.dataset.role === 'addtag') addPop(t);
  else if (t.dataset.role === 'desc') get(t.dataset.id).desc = t.value;
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'sortSel') { S.sort = ev.target.value; render(); } });
document.addEventListener('focusin', (ev) => { if (ev.target.id === 'omni') omniPop(); else if (ev.target.dataset?.role === 'addtag') addPop(ev.target); });
document.addEventListener('keydown', (ev) => {
  const t = ev.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (t.id === 'omni') {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); const n = S.omni.length; S.omniIdx = (S.omniIdx + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n; omniPop(); }
    else if (ev.key === 'Enter') omniPick(S.omniIdx);
    else if (ev.key === 'Backspace' && t.value === '' && S.filter.tags.length) { S.filter.tags.pop(); render(); omniPop(); }
    else if (ev.key === 'Escape') { t.value = ''; t.blur(); closePop(); }
    return;
  }
  if (t.dataset?.role === 'addtag' && ev.key === 'Enter') { const first = $('#pop .pi[data-act="add-tag"]'); if (first) doAdd(first.dataset.tag); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.classList?.contains('trow')) { ev.preventDefault(); t.click(); return; }
  if (ev.key === 'Escape') { if (!$('#pop').hidden) { closePop(); if (typing) t.blur(); } else if (typing) t.blur(); else if (S.viewer) ACT.vclose(); else if (S.sel.size) ACT['clear-sel'](); return; }
  if (typing) return;
  if (ev.key === '/' || (ev.key === 'k' && ev.ctrlKey)) { ev.preventDefault(); $('#omni').focus(); }
  else if (S.viewer && ev.key === 'ArrowRight') ACT.vstep({ d: 1 });
  else if (S.viewer && ev.key === 'ArrowLeft') ACT.vstep({ d: -1 });
  else if (ev.key === 'Delete' && (S.sel.size || S.viewer)) ACT.del();
  else if (ev.key === 'a' && ev.ctrlKey) { ev.preventDefault(); S.sel = new Set(visible().map((e) => e.id)); render(); }
});

/* ───── пояснения ───── */
const NOTES = [
  ['#dockL', 'Папки и теги видны сразу, расставляются как удобно', 'Перетащите заголовок «Папки» или «Теги» на другую панель (над, под, рядом) или к краю галереи. Границы тянутся, расположение запоминается. Готовые варианты — в меню ⋯ на заголовке панели.'],
  ['[data-panel="tags"]', 'Каталог тегов — один, списком', 'Было: одно и то же облако чипов слева под папками и ещё раз справа в «Фильтре». Стало: одна панель «Теги», строки со счётчиками, галочка = тег в фильтре. Щелчок по папке при включённом фильтре ищет внутри неё.'],
  ['#omniBox', 'Поиск и фильтр — одна строка', 'Набираете «гру» → Enter добавляет тег; нет такого тега — ищет по именам. Отдельная панель фильтра и кнопка «Теги» в шапке больше не нужны.'],
  ['#frow', 'Фильтр читается как фраза', '«Место: Грузия или Стамбул и Тема: еда» вместо радиокнопок «И между категориями, ИЛИ внутри». Режим и область — тут же.'],
  ['#insp', 'Свойства — справа, теги — наверху', 'Сейчас панель слева между деревом и галереей, теги в самом низу. Здесь галерея не прыгает, теги сразу под именем.'],
  ['#insp [data-sec="tags"]', 'Чип = одна мишень', 'Щелчок по тегу открывает меню (показать все / на вложенное / снять) вместо трёх мелких кнопок в чипе и галочки «Наследуется».'],
  ['#insp', 'Один и много — одинаково', 'Выделите несколько плиток (Ctrl/Shift): та же панель, общие теги сплошные, частичные — «3/5». Отдельный поповер «Теги выделенных» не нужен.'],
  ['#bar', 'Действия — в панели, плитки чистые', 'Скачать / Переместить / В корзину появляются вместо сортировки, ничего не перекрывает галерею. Теги на плитках — кнопка с биркой рядом с размером, по умолчанию скрыты.'],
];
$('#notes').innerHTML = '<h4>Что изменилось — наведите на пункт</h4>' + NOTES.map(([sel, t, d], i) => `<div class="n" data-hl="${esc(sel)}"><b>${i + 1}</b><span>${t}<em>${d}</em></span></div>`).join('');
$('#notes').addEventListener('mouseover', (ev) => { const n = ev.target.closest('.n'); document.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl')); if (n) $(n.dataset.hl)?.classList.add('hl'); });
$('#notes').addEventListener('mouseleave', () => document.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl')));

$('#omniIcon').innerHTML = ic('search'); $('#addBtn').innerHTML = ic('plus', 14) + 'Добавить'; $('#gearBtn').innerHTML = ic('gear'); $('#lockBtn').innerHTML = ic('lock');
applySizes();
render();
// стартовое состояние: выбран один результат, чтобы сразу была видна панель свойств
const first = visible()[2]; if (first) { S.sel = new Set([first.id]); S.anchor = first.id; render(); }
</script>
</body>
</html>
